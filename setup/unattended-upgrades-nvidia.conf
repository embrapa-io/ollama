// Pacotes que o unattended-upgrades NÃO deve atualizar neste host.
//
// O driver NVIDIA só pode ser trocado junto com um reboot: as bibliotecas de
// usuário mudam na hora, mas o módulo do kernel carregado continua o antigo, e
// todo contêiner com GPU recriado depois disso falha com "NVRM: API mismatch"
// (incidente de 09/10/2026 no GPU Server da GTI — o vLLM ficou quatro dias
// fora do ar). Atualizar driver e kernel de propósito, em janela, com reboot:
//   sudo apt update && sudo apt install nvidia-driver-580 && sudo reboot
//
// Instalar:  sudo cp setup/unattended-upgrades-nvidia.conf /etc/apt/apt.conf.d/51nvidia-hold
// Conferir:  sudo unattended-upgrade --dry-run -d 2>&1 | grep -i -A3 blacklist
//
// As entradas são expressões regulares casadas no início do nome do pacote.
Unattended-Upgrade::Package-Blacklist {
    "nvidia-";
    "libnvidia-";
    "xserver-xorg-video-nvidia-";
    "linux-modules-nvidia-";
};
